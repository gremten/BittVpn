:root { --bg: #0A0C0F; --safe-bottom: max(32px, env(safe-area-inset-bottom)); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); overflow: hidden; }
body { font-family: "Golos UI", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.label { position: absolute; left: 0; top: 0; font-family: "Nothing Font", monospace; font-size: 20px; line-height: 24px; padding: 0 4px; border-radius: 6px; background: rgba(10,12,15,.72); color: #fff; opacity: 0; white-space: nowrap; will-change: transform, opacity; }
.ui { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 20px calc(20px + var(--safe-bottom)); pointer-events: none; }
.ui.live { pointer-events: auto; }
.title { font-family: "Martian Grotesk", sans-serif; font-weight: 500; font-size: 32px; line-height: 40px; margin-bottom: 24px; opacity: 0; will-change: transform, opacity; }
.buttons { display: flex; flex-direction: column; gap: 8px; }
.btn { height: 56px; border: 0; border-radius: 999px; font: 500 16px/20px "Golos UI", sans-serif; padding: 14px 16px; opacity: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; will-change: transform, opacity; }
.btn--primary { background: #fff; color: #0A0C0F; }
.btn--secondary { background: #242A33; color: #fff; }
.btn:active .btn__in { display: inline-block; }
.btn.pressed { transform: scale(0.985) !important; }
.hint { position: fixed; top: 8px; left: 8px; font: 11px/14px monospace; color: rgba(255,255,255,.35); pointer-events: none; }
</style>
</head>

<div id="stage">
  <canvas id="c"></canvas>
  <div class="labels" id="labels"></div>
  <div class="ui" id="ui">
    <h1 class="title" id="title">Добро пожаловать</h1>
    <div class="buttons">
      <button class="btn btn--primary" id="btnContinue" type="button">Продолжить</button>
      <button class="btn btn--secondary" id="btnSkip" type="button">Пропустить</button>
    </div>
  </div>
</div>
<div class="hint" id="hint"></div>

function bezier([x1, y1, x2, y2]) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;

    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const e = sx(t) - x; const d = dx(t); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; t -= e / d; }

    return sy(t);
  };

function render(t) {

  const cp = Math.cos(cam.lat0 * RAD), sp = Math.sin(cam.lat0 * RAD), D = g.dist, f = cam.R * Math.sqrt(D * D - 1);
  const proj3 = (p) => {
    const lonR = Math.atan2(p[0], p[2]) / RAD; const rr = Math.hypot(p[0], p[1], p[2]);
    const cl = Math.hypot(p[0], p[2]); const dl = (lonR - cam.lon0) * RAD;
    const x = cl * Math.sin(dl), y = p[1], z = cl * Math.cos(dl);
    const y2 = y * cp - z * sp, z2 = y * sp + z * cp; const k = f / (D - z2);
    return [cam.cx + x * k, cam.cy - y2 * k, z2];
  };
  const arcDur = SETTINGS.arcs.eachMs, arcStg = SETTINGS.arcs.staggerMs;
  const arrived = {};
  if (t >= T.arcs[0]) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const arc of L.arcs) {
      const t0 = T.arcs[0] + arc.idx * arcStg, t1 = Math.min(T.arcs[1], t0 + arcDur);
      const p = E.arc(prog(t, [t0, t1]));
      arrived[arc.key] = prog(t, [t1 - 80, t1 + 70]);
      if (p <= 0) continue;
      const n = arc.pts.length - 1, head = p * n;
      ctx.beginPath();
      for (let s = 0; s <= Math.ceil(head); s++) {
        let q = arc.pts[Math.min(s, n)];
        if (s > head) { const a0 = arc.pts[s - 1]; const k = head - (s - 1); q = [lerp(a0[0], q[0], k), lerp(a0[1], q[1], k), lerp(a0[2], q[2], k)]; }
        const [x, y] = proj3(q);
        if (s === 0) ctx.moveTo(x * dpr, y * dpr); else ctx.lineTo(x * dpr, y * dpr);
      }
      ctx.strokeStyle = SETTINGS.arcs.color; ctx.lineWidth = SETTINGS.arcs.width * dpr; ctx.stroke();
    }
  }
  // точки-цели
  for (const key of SETTINGS.arcOrder) {
    const k = arrived[key] || 0; if (k <= 0) continue;
    const p = pl[key]; const [x, y] = P(Math.cos(p.lat * RAD), Math.sin(p.lat * RAD), p.lon);
    const r = 3.2 * (0.6 + 0.4 * E.ui(k));
    const gr = ctx.createRadialGradient(x * dpr, y * dpr, 0, x * dpr, y * dpr, 10 * dpr);
    gr.addColorStop(0, `rgba(255,255,255,${0.35 * k})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x * dpr, y * dpr, 10 * dpr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${k})`; ctx.beginPath(); ctx.arc(x * dpr, y * dpr, r * dpr, 0, Math.PI * 2); ctx.fill();
  }
  // красная точка RU
  if (pR > 0) {
    const [x, y] = ruP; const rd = SETTINGS.redDot;
    const pulse = t > T.redDot[1] ? 0.5 + 0.5 * Math.sin((t - T.redDot[1]) / 1000 * 2.2 - Math.PI / 2) : 0;
    const halo = rd.halo * (0.85 + 0.3 * pulse) * pR;
    const gr = ctx.createRadialGradient(x * dpr, y * dpr, 0, x * dpr, y * dpr, halo * dpr);
    gr.addColorStop(0, `rgba(198,53,75,${0.55 * pR})`); gr.addColorStop(1, 'rgba(198,53,75,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x * dpr, y * dpr, halo * dpr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rd.color; ctx.beginPath(); ctx.arc(x * dpr, y * dpr, rd.radius * pR * dpr, 0, Math.PI * 2); ctx.fill();
  }
  // подписи
  for (const key in pl) {
    const el = labelEls[key];
    const k = key === 'RU' ? pR : (arrived[key] || 0);
    if (k <= 0) { el.style.opacity = '0'; continue; }
    const p = pl[key]; const [x, y] = P(Math.cos(p.lat * RAD), Math.sin(p.lat * RAD), p.lon);
    const w = el.offsetWidth || 32, h = 24, gap = 8;
    let lx = x - w / 2, ly = y - h / 2;
    if (p.at === 'left') lx = x - gap - w; if (p.at === 'right') lx = x + gap;
    if (p.at === 'above') ly = y - gap - h; if (p.at === 'below') ly = y + gap - 2;
    el.style.opacity = E.ui(k).toFixed(3);
    el.style.transform = `translate(${lx.toFixed(1)}px, ${ly.toFixed(1)}px)`;
  }

  // ---- интерфейс ----
  fadeUp(title, prog(t, T.title), 12);
  fadeUp(bC, prog(t, T.btnContinue), 16);
  fadeUp(bS, prog(t, T.btnSkip), 16);
  ui.classList.toggle('live', t >= T.uiLive);
}

// нажатие: стандартный pressed 0.985, без навигации
[bC, bS].forEach(b => {
  b.addEventListener('pointerdown', () => b.classList.add('pressed'));
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(e => b.addEventListener(e, () => b.classList.remove('pressed')));
});

// запуск
let start = 0, raf = 0;
function play() {
  cancelAnimationFrame(raf); start = performance.now();
  const loop = (now) => { render(now - start); raf = requestAnimationFrame(loop); };
  raf = requestAnimationFrame(loop);
}
// режим записи: время задаётся номером кадра, без привязки к реальному
window.intro = {
  settings: SETTINGS,
  fps: SETTINGS.fps,
  durationMs: T.end + 500,
  frameCount: () => Math.ceil((T.end + 500) / 1000 * SETTINGS.fps) + 1,
  renderFrame(i) { render(i * 1000 / SETTINGS.fps); },
  renderAt(ms) { render(ms); },
  ready: null,
};

window.addEventListener('resize', () => { resize(); if (RECORD || FIXED_T != null || REDUCED) render(window.__lastT || T.end); });
const fontsReady = Promise.all(['500 32px "Martian Grotesk"', '500 16px "Golos UI"', '20px "Nothing Font"'].map(f => document.fonts.load(f))).catch(() => {});
window.intro.ready = fontsReady.then(() => {
  resize();
  if (REDUCED) { render(T.end); return; }
  if (FIXED_T != null) { render(FIXED_T); return; }
  if (RECORD) {
    console.log('record: intro.renderFrame(i), кадров ' + window.intro.frameCount());
    render(0);
    if (params.get('autoplay') === '1') { // покадровый прогон фиксированным шагом
      let i = 0; const n = window.intro.frameCount();
      const tick = () => { window.intro.renderFrame(i); if (++i < n) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    }
    return;
  }
  play();
});
// повтор: клавиша R (вне режима записи)
window.addEventListener('keydown', e => { if ((e.key === 'r' || e.key === 'к') && !RECORD) play(); });
})();
</script>
